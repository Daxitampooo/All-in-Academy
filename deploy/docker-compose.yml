# Everything the server needs on one VPS: Postgres, the PokerALL server and Caddy (HTTPS with free
# Let's Encrypt certificates). Settings come from deploy/.env (copy .env.example and fill it in).
#
#   cd deploy && docker compose up -d --build
name: pokerall

x-logging: &logging
  driver: json-file
  options:
    # Logs are rotated by size and old ones are deleted automatically.
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokerall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: pokerall
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokerall -d pokerall"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pokerall:${POSTGRES_PASSWORD}@db:5432/pokerall
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      TRUST_PROXY: "true"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
