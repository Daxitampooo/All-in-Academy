# Builds an installable Android APK and attaches it to a GitHub Release.
#
# - Run it by hand (Actions → android-apk → Run workflow) for any branch,
#   push a tag like v0.1.0, or push a commit whose message contains [apk].
# - The release tag is preview-<branch> (or the version tag), so each branch
#   keeps one stable download page that's replaced on every build.
# - Signed with the React Native debug key: fine for testing on your own phone,
#   not for Google Play (that needs an upload key, added before release).
name: android-apk
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main", "feat/**", "fix/**"]
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee -a ci.log

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee -a ../../ci.log

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tail -n 400 | tee -a ../../../ci.log

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          short=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"; title="All-in Academy $GITHUB_REF_NAME"
          else
            slug=$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd '[:alnum:]-._')
            tag="preview-$slug"; title="Тестовая сборка: $GITHUB_REF_NAME"
          fi
          apk="all-in-academy-$version-$short.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          notes="Сборка для проверки на телефоне. Ветка: $GITHUB_REF_NAME, коммит: $short, версия: $version.

          Как установить: скачай файл .apk ниже на Android-телефон и открой его. Если телефон спросит, разреши установку из этого источника.

          Подписана debug-ключом: только для теста, не для Google Play."
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease \
            --title "$title" --notes "$notes" 2>&1 | tee -a ci.log

      - name: Report failure
        if: failure()
        run: .github/scripts/report-failure.sh ci.log
