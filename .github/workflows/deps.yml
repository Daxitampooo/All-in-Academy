# Installs workspace dependencies and publishes them as a cache archive.
#
# Why this exists: the cloud coding session that writes this project has no
# access to the npm registry, so it cannot run `pnpm install` itself. This
# workflow resolves dependencies (updating pnpm-lock.yaml when package.json
# changed), then attaches node_modules as a release asset. The coding session
# downloads that archive to typecheck, lint, test and render web previews.
name: deps
on:
  push:
    branches: ["main", "feat/**", "fix/**"]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/deps.yml"
permissions:
  contents: write
concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Update pnpm-lock.yaml (resolved in CI)"
            git push
          fi
      - name: Pack node_modules
        run: |
          dirs=$(ls -d node_modules apps/*/node_modules packages/*/node_modules 2>/dev/null)
          tar -czf deps-linux-x64.tgz $dirs
          ls -lh deps-linux-x64.tgz
      - name: Publish dependency archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(sha256sum pnpm-lock.yaml | cut -c1-12)
          tag="deps-$hash"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" deps-linux-x64.tgz --clobber
          else
            gh release create "$tag" deps-linux-x64.tgz \
              --target "$GITHUB_SHA" --prerelease \
              --title "Internal: dependency cache $hash" \
              --notes "Служебный архив зависимостей для облачной сессии разработки. Не для установки на телефон."
          fi
          # keep only the 3 newest dependency archives
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("deps-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
