# Checks every push: installs dependencies, then typecheck, lint, locale check
# and a web build.
#
# It also keeps a dependency archive for the cloud coding session, which has no
# npm registry access: when package.json changes, this workflow resolves
# dependencies, commits the updated pnpm-lock.yaml and publishes node_modules as
# a release asset (tag deps-<lockfile hash>). scripts/fetch-deps.sh downloads it.
name: ci
on:
  push:
    branches: ["main", "feat/**", "fix/**"]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # pnpm must be on PATH before setup-node, which caches the pnpm store
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee -a ci.log

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Update pnpm-lock.yaml (resolved in CI)"
            git push 2>&1 | tee -a ci.log
          fi

      - name: Publish dependency archive (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          tag="deps-$(sha256sum pnpm-lock.yaml | cut -c1-12)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Archive $tag already exists"
            exit 0
          fi
          dirs=()
          for d in node_modules apps/*/node_modules packages/*/node_modules; do
            [ -d "$d" ] && dirs+=("$d")
          done
          tar -czf deps-linux-x64.tgz "${dirs[@]}" 2>&1 | tee -a ci.log
          gh release create "$tag" deps-linux-x64.tgz \
            --target "$GITHUB_SHA" --prerelease \
            --title "Internal: dependency cache ${tag#deps-}" \
            --notes "Служебный архив зависимостей для облачной сессии разработки. Не для установки на телефон." 2>&1 | tee -a ci.log
          rm deps-linux-x64.tgz
          # keep only the 3 newest dependency archives
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("deps-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee -a ci.log

      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee -a ci.log

      - name: Unit tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee -a ci.log

      - name: Check translations
        run: |
          set -o pipefail
          pnpm check:locales 2>&1 | tee -a ci.log

      - name: Check training bots isolation
        run: |
          set -o pipefail
          pnpm check:training 2>&1 | tee -a ci.log

      - name: Web build
        working-directory: apps/mobile
        env:
          CI: "1"
        run: |
          set -o pipefail
          pnpm export:web 2>&1 | tee -a ../../ci.log

      - name: Report failure
        if: failure()
        run: .github/scripts/report-failure.sh ci.log
